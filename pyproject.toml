[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-listing-agent"
version = "0.1.0"
description = "电商商品上下架智能 Agent：ERP 素材检索 → SKU 价格匹配 → 多店铺上架 → 飞书归档"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "playwright>=1.45",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "minio>=7.2",
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "starlette>=0.40",
]

[project.scripts]
ec-agent-api = "api.server:run"
ec-agent-init-db = "scripts.init_db:main"

[tool.setuptools.packages.find]
include = ["agent*", "skills*", "engine*", "data*", "integrations*", "api*", "config*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
